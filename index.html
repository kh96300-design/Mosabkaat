<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>برنامج إدارة المسابقة</title>
</head>
<body>
  <p>جارٍ تحميل البرنامج…</p>
  <script>
    (async function () {
      try {
        const response = await fetch("./Index.html", { cache: "no-store" });
        if (!response.ok) throw new Error("تعذّر تحميل ملف البرنامج");
        let html = await response.text();
        const initCall = "    init();";
        const patch = `
    function chooseFirstContestant() {
      const useRandom = confirm("اختيار أول متسابق: اضغط موافق للاختيار العشوائي، أو إلغاء للاختيار اليدوي.");
      if (useRandom) {
        const available = state.players.filter(player => player.status === "available");
        return available.length ? available[Math.floor(Math.random() * available.length)].id : null;
      }
      const entered = prompt(\`أدخل رقم أول متسابق (من 1 إلى \${state.settings.totalPlayers}):\`);
      if (entered === null) return null;
      const id = Number(entered);
      if (!Number.isInteger(id) || id < 1 || id > state.settings.totalPlayers) {
        alert("رقم المتسابق غير صحيح.");
        return null;
      }
      return id;
    }

    const originalInit = init;
    init = function () {
      const isNewGame = !localStorage.getItem("contest_manager_pro_v4");
      originalInit();
      if (isNewGame && state.players.length) {
        const firstId = chooseFirstContestant();
        if (firstId !== null) {
          state.selectorId = firstId;
          addLog(\`بدأت المسابقة بالمتسابق رقم \${firstId}: \${state.players.find(player => player.id === firstId).name}.\`);
          saveState();
          renderAll();
        }
      }
    };

    resetContest = function () {
      if (!state.isAdmin) return;
      if (!confirm("هل أنت متأكد من بدء مسابقة جديدة وتصفير جميع النتائج والاختيارات؟")) return;
      const firstId = chooseFirstContestant();
      if (firstId === null) return;
      setupFreshGame();
      // setupFreshGame يصفر الانتصارات والأخطاء والاعتذارات والأسئلة المستخدمة.
      state.selectorId = firstId;
      addLog(\`بدأت مسابقة جديدة، وأول متسابق هو رقم \${firstId}: \${state.players.find(player => player.id === firstId).name}.\`);
      saveState();
      renderAll();
    };

    init();`;
        if (!html.includes(initCall)) throw new Error("لم يتم العثور على نقطة تشغيل البرنامج");
        html = html.replace(initCall, patch);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = "<p dir='rtl'>تعذّر فتح البرنامج. أعد تحميل الصفحة أو افتح ملف Index.html مباشرة.</p>";
      }
    })();
  </script>
</body>
</html>

<option value="easy">سهل</option>
            <option value="medium">متوسط</option>
            <option value="hard">صعب</option>
          </select>
        </div>

        <div class="settings-grid" style="margin-bottom: 10px;">
          <div class="form-field">
            <label>نص السؤال الجديد</label>
            <input type="text" id="newQText" placeholder="اكتب السؤال هنا..." />
          </div>
          <div class="form-field">
            <label>الإجابة الصحيحة</label>
            <input type="text" id="newQAnswer" placeholder="اكتب الإجابة..." />
          </div>
          <div class="form-field">
            <label>المستوى</label>
            <select id="newQLevel">
              <option value="easy">🟢 سهل</option>
              <option value="medium">🟡 متوسط</option>
              <option value="hard">🔴 صعب</option>
            </select>
          </div>
        </div>
        <button class="btn-primary" onclick="addQuestionToArchive()" style="margin-bottom: 14px;">➕ إضافة سؤال للأرشيف</button>

        <div id="archiveListContainer"></div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_QUESTIONS = [
      { id: 1, text: "ما هي عاصمة سلطنة عُمان؟", answer: "مسقط", level: "easy" },
      { id: 2, text: "ما هو أطول نهر في العالم؟", answer: "نهر النيل", level: "easy" },
      { id: 3, text: "كم عدد كواكب المجموعة الشمسية؟", answer: "8 كواكب", level: "easy" },
      { id: 4, text: "ما هو العنصر الكيميائي الذي رمزه Au؟", answer: "الذهب", level: "medium" },
      { id: 5, text: "في أي قارة تقع جمهورية البرازيل؟", answer: "أمريكا الجنوبية", level: "easy" },
      { id: 6, text: "ما هو أسرع حيوان بري؟", answer: "الفهد (الشيتا)", level: "easy" },
      { id: 7, text: "من هو مؤلف كتاب المقدمة؟", answer: "ابن خلدون", level: "medium" },
      { id: 8, text: "ما هي أكبر محيطات العالم مساحة؟", answer: "المحيط الهادئ", level: "medium" },
      { id: 9, text: "كم عدد سور القرآن الكريم؟", answer: "114 سورة", level: "easy" },
      { id: 10, text: "ما هو الغاز الأكثر وفرة في الغلاف الجوي للأرض؟", answer: "النيتروجين", level: "hard" }
    ];

    const STORAGE_KEY = "contest_pro_sync_v1";
    const channel = ("BroadcastChannel" in window) ? new BroadcastChannel("contest_pro_sync_channel") : null;

    let state = loadState();
    let historyStack = [];
    let timerInterval = null;
    let sheetsSyncTimer = null;
    let isAdmin = false;

    function createInitialState() {
      const totalPlayers = 15;
      const players = Array.from({ length: totalPlayers }, (_, i) => ({
        number: i + 1,
        name: "",
        status: "available", // available | eliminated | winner
        kills: 0,
        errors: 0,
        passes: 0
      }));

      return {
        settings: {
          killsToWin: 3,
          maxWinners: 3,
          totalPlayers: totalPlayers,
          cols: 5,
          maxErrors: 2,
          maxPasses: 1,
          timerSec: 30,
          orderedScreens: 2,
          adminPass: "1234",
          cloudSyncUrl: ""
        },
        sheetsConfig: {
          url: "",
          range: "",
          intervalSec: 30,
          autoSync: false,
          lastSyncText: "لم يتم التزامن بعد"
        },
        players,
        questions: [...DEFAULT_QUESTIONS],
        usedQuestionIds: [],
        winners: [],
        logs: ["بدأت المسابقة بنجاح."],
        followersCount: 0,
        isFollowing: false,
        selectionMode: "random",
        currentSelector: null,
        currentTarget: null,
        activeQuestion: null,
        timeLeft: 30,
        timerRunning: false,
        answerRevealed: false
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createInitialState();
        const parsed = JSON.parse(raw);
        const base = createInitialState();
        return {
          ...base,
          ...parsed,
          settings: { ...base.settings, ...(parsed.settings || {}) },
          sheetsConfig: { ...base.sheetsConfig, ...(parsed.sheetsConfig || {}) }
        };
      } catch (e) {
        return createInitialState();
      }
    }

    function saveState(broadcastMsg = null) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (channel && broadcastMsg) {
        channel.postMessage({ type: "STATE_UPDATE", msg: broadcastMsg, state });
      }
      if (isAdmin && state.settings.cloudSyncUrl) {
        pushToCloudSync(broadcastMsg || "update");
      }
    }

    function broadcastFullState(reason = "تحديث") {
      saveState(reason);
      addLog(`تمت مزامنة الحالة (${reason}).`);
      renderAll();
    }

    async function pushToCloudSync(reason) {
      if (!state.settings.cloudSyncUrl) return;
      try {
        await fetch(state.settings.cloudSyncUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reason, timestamp: new Date().toISOString(), state })
        });
      } catch (err) {
        console.warn("Cloud sync push skipped/failed:", err);
      }
    }

    if (channel) {
      channel.onmessage = (event) => {
        if (event.data && event.data.type === "STATE_UPDATE" && event.data.state) {
          const prevFollow = state.isFollowing;
          state = { ...event.data.state, isFollowing: prevFollow };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          renderAll();
        }
      };
    }

    function pushHistory() {
      historyStack.push(JSON.stringify(state));
      if (historyStack.length > 25) historyStack.shift();
      updateUndoButton();
    }

    function undoAction() {
      if (!isAdmin || historyStack.length === 0) return;
      const prev = JSON.parse(historyStack.pop());
      state = prev;
      saveState("تراجع عن آخر إجراء");
      updateUndoButton();
      renderAll();
    }

    function updateUndoButton() {
      const btn = document.getElementById("undoBtn");
      if (btn) btn.disabled = !isAdmin || historyStack.length === 0;
    }

    function addLog(text) {
      const time = new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      state.logs.unshift(`[${time}] ${text}`);
      if (state.logs.length > 100) state.logs.pop();
    }

    // صلاحيات المدير والجمهور
    function handleRoleButton() {
      if (isAdmin) {
        isAdmin = false;
        document.body.classList.add("viewer-mode");
        updateRoleUI();
        renderAll();
      } else {
        document.getElementById("loginPassInput").value = "";
        document.getElementById("loginModal").classList.add("open");
        setTimeout(() => document.getElementById("loginPassInput").focus(), 50);
      }
    }

    function closeLoginModal() {
      document.getElementById("loginModal").classList.remove("open");
    }

    function verifyAdminLogin() {
      const pass = document.getElementById("loginPassInput").value.trim();
      if (pass === state.settings.adminPass) {
        isAdmin = true;
        document.body.classList.remove("viewer-mode");
        closeLoginModal();
        updateRoleUI();
        renderAll();
      } else {
        alert("الرقم السري غير صحيح!");
      }
    }

    function updateRoleUI() {
      const badge = document.getElementById("roleBadge");
      const btn = document.getElementById("toggleRoleBtn");
      const devTag = document.getElementById("deviceRoleTag");
      if (isAdmin) {
        badge.textContent = "وضع المدير";
        badge.classList.remove("viewer");
        btn.textContent = "🔒 خروج المدير";
        btn.className = "btn-ghost";
        if (devTag) devTag.textContent = "جهاز تحكم المدير";
      } else {
        badge.textContent = "وضع الجمهور أولاً";
        badge.classList.add("viewer");
        btn.textContent = "🔑 دخول المدير";
        btn.className = "btn-warning";
        if (devTag) devTag.textContent = "جهاز مشاهدة";
      }
      updateUndoButton();
    }

    // المتابعة والمشاهدون
    function toggleFollowContest() {
      if (!state.isFollowing) {
        state.isFollowing = true;
        state.followersCount += 1;
      } else {
        state.isFollowing = false;
        state.followersCount = Math.max(0, state.followersCount - 1);
      }
      saveState("تحديث عدد المتابعين");
      renderStatsAndAudience();
    }

    // تسجيل المتسابقين
    function registerPlayer() {
      if (!isAdmin) return;
      const input = document.getElementById("playerNameInput");
      const name = input.value.trim();
      if (!name) return;

      const emptySlot = state.players.find(p => !p.name && p.status === "available");
      if (!emptySlot) {
        alert("جميع الأماكن المتاحة مسجلة بالفعل!");
        return;
      }
      pushHistory();
      emptySlot.name = name;
      input.value = "";
      addLog(`تم تسجيل المتسابق رقم (${emptySlot.number}): ${name}`);
      saveState("تسجيل متسابق");
      renderAll();
    }

    function removeLastPlayer() {
      if (!isAdmin) return;
      const lastFilled = [...state.players].reverse().find(p => p.name);
      if (!lastFilled) return;
      pushHistory();
      addLog(`تم حذف تسجيل المتسابق رقم (${lastFilled.number}): ${lastFilled.name}`);
      lastFilled.name = "";
      lastFilled.kills = 0;
      lastFilled.errors = 0;
      lastFilled.passes = 0;
      lastFilled.status = "available";
      saveState("حذف آخر تسجيل");
      renderAll();
    }

    function importNamesFromFile(event) {
      if (!isAdmin) return;
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const lines = e.target.result
          .split(/\r?\n|,/)
          .map(s => s.trim())
          .filter(Boolean);
        if (lines.length === 0) return;

        pushHistory();
        const replace = document.getElementById("replaceNamesCheck").checked;
        if (replace) {
          state.players.forEach((p, idx) => {
            p.name = lines[idx] || "";
            p.status = "available";
            p.kills = 0;
            p.errors = 0;
            p.passes = 0;
          });
        } else {
          let i = 0;
          for (const p of state.players) {
            if (!p.name && i < lines.length) {
              p.name = lines[i++];
            }
          }
        }
        addLog(`تم استيراد ${lines.length} اسماً من الملف.`);
        saveState("استيراد أسماء");
        renderAll();
        event.target.value = "";
      };
      reader.readAsText(file, "UTF-8");
    }

    // مزامنة Google Sheets
    function saveGoogleSheetsConfig(notify = false) {
      state.sheetsConfig.url = document.getElementById("sheetsUrlInput").value.trim();
      state.sheetsConfig.range = document.getElementById("sheetsRangeInput").value.trim();
      state.sheetsConfig.intervalSec = Math.max(5, parseInt(document.getElementById("sheetsIntervalInput").value, 10) || 30);
      state.sheetsConfig.autoSync = document.getElementById("sheetsAutoSyncCheck").checked;
      saveState();
      toggleGoogleSheetsAutoSync();
      if (notify) {
        document.getElementById("sheetsSyncStatus").textContent = "تم حفظ إعدادات Google Sheets.";
      }
    }

    function buildSheetsCsvUrl(rawUrl, range) {
      let url = rawUrl.trim();
      const sheetMatch = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (sheetMatch && !url.includes("output=csv") && !url.includes("/gviz/tq")) {
        const id = sheetMatch[1];
        const gidMatch = url.match(/[#&?]gid=([0-9]+)/);
        const gidParam = gidMatch ? `&gid=${gidMatch[1]}` : "";
        const rangeParam = range ? `&range=${encodeURIComponent(range)}` : "";
        return `https://docs.google.com/spreadsheets/d/${id}/export?format=csv${gidParam}${rangeParam}`;
      }
      return url;
    }

    async function syncNamesFromGoogleSheets(silent = false) {
      saveGoogleSheetsConfig(false);
      const statusEl = document.getElementById("sheetsSyncStatus");
      if (!state.sheetsConfig.url) {
        if (!silent) statusEl.textContent = "يرجى إدخال رابط شيت جوجل أولاً.";
        return;
      }

      const fetchUrl = buildSheetsCsvUrl(state.sheetsConfig.url, state.sheetsConfig.range);
      if (!silent) statusEl.textContent = "جاري جلب الأسماء...";

      try {
        const res = await fetch(fetchUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();

        let names = [];
        const trimmed = text.trim();
        if (trimmed.startsWith("{") || trimmed.startsWith("[")) {
          const json = JSON.parse(trimmed);
          const rows = Array.isArray(json) ? json : (json.names || json.values || json.data || []);
          names = rows.flat().map(v => String(v || "").trim()).filter(Boolean);
        } else {
          names = text
            .split(/\r?\n/)
            .map(line => line.split(",")[0].replace(/^"|"$/g, "").trim())
            .filter(Boolean);
        }

        if (names.length === 0) throw new Error("لم يتم العثور على أسماء");

        pushHistory();
        state.players.forEach((p, idx) => {
          if (idx < names.length) {
            p.name = names[idx];
          }
        });

        const nowStr = new Date().toLocaleTimeString("ar-EG");
        state.sheetsConfig.lastSyncText = `تمت مزامنة ${names.length} اسماً (${nowStr})`;
        statusEl.textContent = state.sheetsConfig.lastSyncText;
        addLog(state.sheetsConfig.lastSyncText);
        saveState("مزامنة الأسماء من Google Sheets");
        renderAll();
      } catch (err) {
        const msg = `تعذر التزامن المباشر (تحقق من مشاركة الرابط أو CORS): ${err.message}`;
        statusEl.textContent = msg;
        if (!silent) console.warn(msg);
      }
    }

    function toggleGoogleSheetsAutoSync() {
      if (sheetsSyncTimer) {
        clearInterval(sheetsSyncTimer);
        sheetsSyncTimer = null;
      }
      const enabled = document.getElementById("sheetsAutoSyncCheck").checked;
      state.sheetsConfig.autoSync = enabled;
      if (enabled) {
        const sec = Math.max(5, parseInt(document.getElementById("sheetsIntervalInput").value, 10) || 30);
        sheetsSyncTimer = setInterval(() => syncNamesFromGoogleSheets(true), sec * 1000);
      }
    }

    // اختيار الخصم والأسئلة
    function changeSelectionMode() {
      if (!isAdmin) return;
      state.selectionMode = document.getElementById("selectionModeSelect").value;
      saveState("تغيير نمط اختيار الخصم");
      renderStage();
      renderPlayersGrid();
    }

    function pickRandomTarget() {
      if (!isAdmin) return;
      const available = state.players.filter(p => p.status === "available");
      if (available.length === 0) {
        alert("لا يوجد متسابقون متاحون حالياً!");
        return;
      }
      pushHistory();
      const chosen = available[Math.floor(Math.random() * available.length)];
      state.currentTarget = chosen.number;
      if (!state.currentSelector) {
        state.currentSelector = chosen.number;
      }
      assignQuestionForTarget(chosen.number);
    }

    function handlePlayerTileClick(num) {
      const player = state.players.find(p => p.number === num);
      if (!player || !isAdmin) return;
      if (player.status === "eliminated" || player.status === "winner") return;

      if (state.selectionMode === "manual") {
        pushHistory();
        if (!state.currentSelector || state.currentSelector === num) {
          state.currentSelector = num;
          addLog(`تم تعيين اللاعب رقم (${num}) كمختار.`);
        } else {
          state.currentTarget = num;
          assignQuestionForTarget(num);
          return;
        }
        saveState("تحديد المختار يدوياً");
        renderAll();
      } else {
        pushHistory();
        state.currentTarget = num;
        if (!state.currentSelector) state.currentSelector = num;
        assignQuestionForTarget(num);
      }
    }

    function assignQuestionForTarget(targetNum) {
      const levelFilter = document.getElementById("levelSelector").value;
      let pool = state.questions.filter(q => !state.usedQuestionIds.includes(q.id));
      if (pool.length === 0) {
        state.usedQuestionIds = [];
        pool = [...state.questions];
      }
      if (levelFilter !== "all") {
        const filtered = pool.filter(q => q.level === levelFilter);
        if (filtered.length > 0) pool = filtered;
      }
      const q = pool[Math.floor(Math.random() * pool.length)];
      state.activeQuestion = q;
      if (!state.usedQuestionIds.includes(q.id)) {
        state.usedQuestionIds.push(q.id);
      }
      state.answerRevealed = false;
      state.timeLeft = state.settings.timerSec;
      state.timerRunning = true;

      addLog(`طُرح سؤال على المتسابق رقم (${targetNum}).`);
      saveState("طرح سؤال جديد");
      startTimer();
      renderAll();
    }

    function revealAnswer() {
      state.answerRevealed = !state.answerRevealed;
      document.getElementById("answerBox").classList.toggle("visible", state.answerRevealed);
    }

    function handleAnswer(isCorrect) {
      if (!isAdmin || !state.currentTarget) return;
      stopTimer();
      pushHistory();

      const target = state.players.find(p => p.number === state.currentTarget);
      const selector = state.players.find(p => p.number === state.currentSelector);

      if (isCorrect) {
        if (selector && selector.number !== target.number && selector.status === "available") {
          selector.kills += 1;
          addLog(`إجابة صحيحة من (${target.number}) لصالح المختار (${selector.number}) - الإسقاطات: ${selector.kills}/${state.settings.killsToWin}`);
          checkWinner(selector);
        } else if (target) {
          target.kills += 1;
          addLog(`إجابة صحيحة للمتسابق رقم (${target.number}) - الإسقاطات: ${target.kills}/${state.settings.killsToWin}`);
          checkWinner(target);
        }
        if (target && target.status === "available") {
          state.currentSelector = target.number;
        }
      } else {
        if (target) {
          target.errors += 1;
          addLog(`إجابة خاطئة من المتسابق رقم (${target.number}) - الأخطاء: ${target.errors}/${state.settings.maxErrors}`);
          triggerShake();
          if (target.errors >= state.settings.maxErrors) {
            target.status = "eliminated";
            addLog(`خروج المتسابق رقم (${target.number}) بسبب تجاوز الحد المسموح من الأخطاء.`);
          }
        }
      }

      state.currentTarget = null;
      state.activeQuestion = null;
      state.timerRunning = false;
      saveState(isCorrect ? "إجابة صحيحة" : "إجابة خاطئة");
      renderAll();
    }

    function handlePass() {
      if (!isAdmin || !state.currentTarget) return;
      stopTimer();
      pushHistory();
      const target = state.players.find(p => p.number === state.currentTarget);
      if (target) {
        target.passes += 1;
        addLog(`اعتذار / تمرير من المتسابق رقم (${target.number}) (${target.passes}/${state.settings.maxPasses}).`);
        if (target.passes > state.settings.maxPasses) {
          target.status = "eliminated";
          addLog(`استبعاد المتسابق رقم (${target.number}) لتجاوز عدد الاعتذارات المسموح.`);
          triggerShake();
        }
      }
      state.currentTarget = null;
      state.activeQuestion = null;
      state.timerRunning = false;
      saveState("اعتذار / تمرير");
      renderAll();
    }

    function checkWinner(player) {
      if (player.status === "winner") return;
      if (player.kills >= state.settings.killsToWin && state.winners.length < state.settings.maxWinners) {
        player.status = "winner";
        state.winners.push({
          number: player.number,
          name: player.name || `لاعب #${player.number}`,
          kills: player.kills
        });
        addLog(`🏆 فوز المتسابق رقم (${player.number}) ${player.name || ""} بالمركز #${state.winners.length}!`);
        launchConfetti();
      }
    }

    // المؤقت والمؤثرات
    function startTimer() {
      stopTimer();
      if (!state.timerRunning) return;
      timerInterval = setInterval(() => {
        if (!state.timerRunning) return;
        state.timeLeft -= 1;
        if (state.timeLeft <= 0) {
          state.timeLeft = 0;
          state.timerRunning = false;
          stopTimer();
        }
        renderTimerOnly();
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function toggleTimer() {
      if (!isAdmin || !state.activeQuestion) return;
      state.timerRunning = !state.timerRunning;
      if (state.timerRunning) startTimer();
      else stopTimer();
      renderTimerOnly();
    }

    function renderTimerOnly() {
      const el = document.getElementById("timerDisplay");
      const btn = document.getElementById("timerToggleBtn");
      if (!el) return;
      el.textContent = state.timeLeft;
      el.classList.toggle("urgent", state.timeLeft <= 5 && state.timeLeft > 0);
      if (btn) btn.textContent = state.timerRunning ? "⏸️" : "▶️";
    }

    function triggerShake() {
      document.body.classList.remove("shake-effect");
      void document.body.offsetWidth;
      document.body.classList.add("shake-effect");
    }

    function launchConfetti() {
      const canvas = document.getElementById("confettiCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ["#eab308", "#3b82f6", "#10b981", "#f43f5e", "#a855f7"];
      const pieces = Array.from({ length: 110 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        w: 7 + Math.random() * 6,
        h: 4 + Math.random() * 5,
        vy: 2.5 + Math.random() * 4,
        vx: -2 + Math.random() * 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * 360
      }));
      let frames = 0;
      function draw() {
        frames++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += 5;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        if (frames < 140) requestAnimationFrame(draw);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      draw();
    }

    // الشاشات المرتبة
    function openDisplayWindow(screenNum = 1) {
      const url = `${window.location.href.split("#")[0]}#screen=${screenNum}`;
      window.open(url, `contest_screen_${screenNum}`, "noopener,noreferrer");
    }

    function updateOrderedScreensCount() {
      if (!isAdmin) return;
      const val = Math.max(1, Math.min(12, parseInt(document.getElementById("orderedScreensInput").value, 10) || 1));
      pushHistory();
      state.settings.orderedScreens = val;
      saveState("تحديث عدد الشاشات المرتبة");
      renderOrderedScreens();
    }

    function openAllOrderedScreens() {
      for (let i = 1; i <= state.settings.orderedScreens; i++) {
        openDisplayWindow(i);
      }
    }

    function renderOrderedScreens() {
      const container = document.getElementById("orderedScreensList");
      const input = document.getElementById("orderedScreensInput");
      if (!container) return;
      if (input) input.value = state.settings.orderedScreens;
      container.innerHTML = "";
      for (let i = 1; i <= state.settings.orderedScreens; i++) {
        const div = document.createElement("div");
        div.className = "screen-card";
        div.innerHTML = `
          <div>
            <strong>شاشة عرض #${i}</strong>
            <span class="screen-status online" style="margin-right:6px;">● جاهزة</span>
          </div>
          <button class="btn-cyan" style="padding:5px 10px; font-size:0.78rem;" onclick="openDisplayWindow(${i})">فتح</button>
        `;
        container.appendChild(div);
      }
    }

    // الإعدادات والأرشيف
    function openSettings() {
      if (!isAdmin) return;
      document.getElementById("cfgKillsToWin").value = state.settings.killsToWin;
      document.getElementById("cfgMaxWinners").value = state.settings.maxWinners;
      document.getElementById("cfgTotalPlayers").value = state.settings.totalPlayers;
      document.getElementById("cfgCols").value = state.settings.cols;
      document.getElementById("cfgMaxErrors").value = state.settings.maxErrors;
      document.getElementById("cfgMaxPasses").value = state.settings.maxPasses;
      document.getElementById("cfgTimerSec").value = state.settings.timerSec;
      document.getElementById("cfgOrderedScreens").value = state.settings.orderedScreens;
      document.getElementById("cfgCloudSyncUrl").value = state.settings.cloudSyncUrl || "";
      renderArchiveList();
      document.getElementById("settingsModal").classList.add("open");
    }

    function closeSettings() {
      document.getElementById("settingsModal").classList.remove("open");
    }

    function saveSettings() {
      if (!isAdmin) return;
      pushHistory();

      const newTotal = Math.max(2, Math.min(100, parseInt(document.getElementById("cfgTotalPlayers").value, 10) || 15));
      state.settings.killsToWin = Math.max(1, parseInt(document.getElementById("cfgKillsToWin").value, 10) || 3);
      state.settings.maxWinners = Math.max(1, parseInt(document.getElementById("cfgMaxWinners").value, 10) || 3);
      state.settings.cols = Math.max(2, Math.min(12, parseInt(document.getElementById("cfgCols").value, 10) || 5));
      state.settings.maxErrors = Math.max(1, parseInt(document.getElementById("cfgMaxErrors").value, 10) || 2);
      state.settings.maxPasses = Math.max(0, parseInt(document.getElementById("cfgMaxPasses").value, 10) || 1);
      state.settings.timerSec = Math.max(5, parseInt(document.getElementById("cfgTimerSec").value, 10) || 30);
      state.settings.orderedScreens = Math.max(1, Math.min(12, parseInt(document.getElementById("cfgOrderedScreens").value, 10) || 2));
      state.settings.cloudSyncUrl = document.getElementById("cfgCloudSyncUrl").value.trim();

      if (newTotal > state.players.length) {
        for (let i = state.players.length + 1; i <= newTotal; i++) {
          state.players.push({ number: i, name: "", status: "available", kills: 0, errors: 0, passes: 0 });
        }
      } else if (newTotal < state.players.length) {
        state.players = state.players.slice(0, newTotal);
      }
      state.settings.totalPlayers = newTotal;

      addLog("تم حفظ وتطبيق إعدادات المسابقة الجديدة.");
      saveState("تحديث الإعدادات");
      closeSettings();
      renderAll();
    }

    function changePassword() {
      if (!isAdmin) return;
      const np = document.getElementById("newAdminPass").value.trim();
      if (!np) return;
      state.settings.adminPass = np;
      document.getElementById("newAdminPass").value = "";
      saveState();
      alert("تم تحديث الرقم السري للمدير بنجاح.");
    }

    function addQuestionToArchive() {
      if (!isAdmin) return;
      const text = document.getElementById("newQText").value.trim();
      const answer = document.getElementById("newQAnswer").value.trim();
      const level = document.getElementById("newQLevel").value;
      if (!text || !answer) return;

      pushHistory();
      const nextId = state.questions.reduce((max, q) => Math.max(max, q.id), 0) + 1;
      state.questions.push({ id: nextId, text, answer, level });
      document.getElementById("newQText").value = "";
      document.getElementById("newQAnswer").value = "";
      addLog(`تمت إضافة سؤال جديد إلى الأرشيف (${level}).`);
      saveState("إضافة سؤال للأرشيف");
      renderArchiveList();
      renderStatsAndAudience();
    }

    function deleteQuestionFromArchive(id) {
      if (!isAdmin) return;
      pushHistory();
      state.questions = state.questions.filter(q => q.id !== id);
      saveState("حذف سؤال من الأرشيف");
      renderArchiveList();
      renderStatsAndAudience();
    }

    function renderArchiveList() {
      const filter = document.getElementById("archiveFilterSelect")?.value || "all";
      const container = document.getElementById("archiveListContainer");
      const countEl = document.getElementById("archiveTotalCount");
      if (!container) return;
      if (countEl) countEl.textContent = state.questions.length;

      const list = filter === "all" ? state.questions : state.questions.filter(q => q.level === filter);
      container.innerHTML = list.map(q => `
        <div class="archive-item">
          <div>
            <strong>${q.text}</strong>
            <div style="font-size:0.78rem; color:var(--text-muted);">الإجابة: ${q.answer} | المستوى: ${q.level}</div>
          </div>
          <button class="btn-danger" style="padding:4px 8px; font-size:0.75rem;" onclick="deleteQuestionFromArchive(${q.id})">حذف</button>
        </div>
      `).join("") || "<p style='color:var(--text-muted); font-size:0.85rem;'>لا توجد أسئلة مطابقة.</p>";
    }

    // النسخ الاحتياطي والتقارير
    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `contest_backup_${Date.now()}.json`;
      a.click();
    }

    function importBackupJSON(event) {
      if (!isAdmin) return;
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          pushHistory();
          state = { ...createInitialState(), ...imported };
          saveState("استعادة نسخة احتياطية");
          renderAll();
          alert("تمت استعادة النسخة الاحتياطية بنجاح.");
        } catch {
          alert("ملف النسخة الاحتياطية غير صالح.");
        }
        event.target.value = "";
      };
      reader.readAsText(file, "UTF-8");
    }

    function openReportsModal() {
      const box = document.getElementById("reportPreviewBox");
      const rows = state.players.map(p =>
        `#${p.number} | ${p.name || "—"} | الحالة: ${p.status} | الإسقاطات: ${p.kills} | الأخطاء: ${p.errors} | الاعتذارات: ${p.passes}`
      ).join("<br>");
      box.innerHTML = rows || "لا توجد بيانات.";
      document.getElementById("reportsModal").classList.add("open");
    }

    function closeReportsModal() {
      document.getElementById("reportsModal").classList.remove("open");
    }

    function exportExcelCSV() {
      const header = ["الرقم", "الاسم", "الحالة", "الإسقاطات", "الأخطاء", "الاعتذارات"];
      const lines = [header.join(",")];
      state.players.forEach(p => {
        lines.push([
          p.number,
          `"${(p.name || "").replace(/"/g, '""')}"`,
          p.status,
          p.kills,
          p.errors,
          p.passes
        ].join(","));
      });
      const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `contest_report_${Date.now()}.csv`;
      a.click();
    }

    function printPDFReport() {
      window.print();
    }

    function resetContest() {
      if (!isAdmin) return;
      if (!confirm("هل أنت متأكد من بدء مسابقة جديدة وتصفير النتائج؟")) return;
      pushHistory();
      const keepNames = state.players.map(p => p.name);
      const keepSettings = { ...state.settings };
      const keepQuestions = [...state.questions];
      const keepSheets = { ...state.sheetsConfig };
      state = createInitialState();
      state.settings = keepSettings;
      state.questions = keepQuestions;
      state.sheetsConfig = keepSheets;
      state.players.forEach((p, idx) => {
        p.name = keepNames[idx] || "";
      });
      addLog("تم بدء مسابقة جديدة.");
      saveState("مسابقة جديدة");
      renderAll();
    }

    // العرض والتصيير
    function resetPlayerFilters() {
      document.getElementById("playerStatusFilter").value = "all";
      document.getElementById("playerSearchInput").value = "";
      renderPlayersGrid();
    }

    function renderPlayersGrid() {
      const grid = document.getElementById("playersGrid");
      if (!grid) return;
      grid.style.setProperty("--cols", state.settings.cols);

      const statusFilter = document.getElementById("playerStatusFilter")?.value || "all";
      const searchVal = (document.getElementById("playerSearchInput")?.value || "").trim().toLowerCase();

      const filtered = state.players.filter(p => {
        const matchStatus = statusFilter === "all" || p.status === statusFilter;
        const matchSearch =
          !searchVal ||
          String(p.number).includes(searchVal) ||
          (p.name && p.name.toLowerCase().includes(searchVal));
        return matchStatus && matchSearch;
      });

      grid.innerHTML = "";
      filtered.forEach(p => {
        const tile = document.createElement("div");
        let stateClass = "state-available";
        if (p.status === "eliminated") stateClass = "state-eliminated";
        else if (p.status === "winner") stateClass = "state-winner";
        else if (p.number === state.currentTarget) stateClass = "state-target";
        else if (p.number === state.currentSelector) stateClass = "state-selector";

        const manualLocked = !isAdmin || (state.selectionMode === "manual" && p.status !== "available");
        tile.className = `player-tile ${stateClass} ${manualLocked ? "manual-locked" : ""}`;
        tile.onclick = () => handlePlayerTileClick(p.number);

        tile.innerHTML = `
          <div class="player-num">${p.number}</div>
          <div class="player-name">${p.name || "غير مسجل"}</div>
          <div class="player-badges">
            <span class="mini-badge">🎯 ${p.kills}</span>
            <span class="mini-badge err-badge">❌ ${p.errors}</span>
          </div>
        `;
        grid.appendChild(tile);
      });
    }

    function renderStage() {
      const selDisp = document.getElementById("currentSelectorDisplay");
      const statsDisp = document.getElementById("selectorStatsDisplay");
      const instText = document.getElementById("selectionInstructionText");
      const qCard = document.getElementById("questionCard");

      const selectorObj = state.players.find(p => p.number === state.currentSelector);
      const targetObj = state.players.find(p => p.number === state.currentTarget);

      if (selectorObj) {
        selDisp.textContent = `المختار الحالي: رقم (${selectorObj.number}) ${selectorObj.name || ""}`;
        statsDisp.textContent = `الإسقاطات: ${selectorObj.kills} / ${state.settings.killsToWin} | الأخطاء: ${selectorObj.errors} / ${state.settings.maxErrors}`;
      } else {
        selDisp.textContent = "لم يتم تحديد مختار بعد";
        statsDisp.textContent = "";
      }

      if (state.selectionMode === "manual") {
        instText.textContent = "الوضع اليدوي: انقر على رقم المختار أولاً ثم انقر على رقم الخصم المراد سؤاله.";
      } else {
        instText.textContent = "الوضع العشوائي: اضغط (اختيار عشوائي) أو انقر على متسابق متاح لتوجيه السؤال.";
      }

      if (state.activeQuestion && targetObj) {
        qCard.classList.add("active");
        document.getElementById("targetPlayerLabel").textContent = `رقم (${targetObj.number}) ${targetObj.name || ""}`;
        document.getElementById("questionText").textContent = state.activeQuestion.text;
        document.getElementById("answerText").textContent = state.activeQuestion.answer;
        document.getElementById("answerBox").classList.toggle("visible", state.answerRevealed);

        const lvlBadge = document.getElementById("questionLevelBadge");
        lvlBadge.className = `level-pill level-${state.activeQuestion.level}`;
        lvlBadge.textContent =
          state.activeQuestion.level === "easy" ? "🟢 سهل" :
          state.activeQuestion.level === "medium" ? "🟡 متوسط" : "🔴 صعب";

        renderTimerOnly();
      } else {
        qCard.classList.remove("active");
      }
    }

    function renderStatsAndAudience() {
      const activeCount = state.players.filter(p => p.status === "available").length;
      const elimCount = state.players.filter(p => p.status === "eliminated").length;
      const remQuestions = Math.max(0, state.questions.length - state.usedQuestionIds.length);

      document.getElementById("statActive").textContent = activeCount;
      document.getElementById("statWinners").textContent = `${state.winners.length} / ${state.settings.maxWinners}`;
      document.getElementById("statEliminated").textContent = elimCount;
      document.getElementById("statQuestions").textContent = remQuestions;
      document.getElementById("statFollowers").textContent = state.followersCount;
      document.getElementById("inlineFollowersCount").textContent = state.followersCount;

      const followBtn = document.getElementById("followBtn");
      if (followBtn) {
        followBtn.textContent = state.isFollowing ? "✓ متابَع" : "⭐ متابعة المسابقة";
      }

      const emptyCount = state.players.filter(p => !p.name && p.status === "available").length;
      const nextHint = document.getElementById("nextSlotHint");
      if (nextHint) {
        nextHint.textContent = `الأماكن الشاغرة للتسجيل: ${emptyCount} من أصل ${state.settings.totalPlayers}`;
      }

      const winnersUl = document.getElementById("winnersList");
      winnersUl.innerHTML = state.winners.length
        ? state.winners.map((w, idx) => `<li><span>#${idx + 1} - ${w.name} (رقم ${w.number})</span><span>🎯 ${w.kills}</span></li>`).join("")
        : "<li style='background:none; border:none; color:var(--text-muted); font-weight:400;'>لم يُعلن عن فائزين بعد.</li>";

      const logUl = document.getElementById("logList");
      logUl.innerHTML = state.logs.map(item => `<li>${item}</li>`).join("");

      document.getElementById("dynamicRulesText").textContent =
        `الفوز بـ (${state.settings.killsToWin}) إسقاطات | الحد الأقصى للفائزين: (${state.settings.maxWinners}) | الأخطاء المسموحة: (${state.settings.maxErrors}) | الاعتذارات: (${state.settings.maxPasses}) | وقت السؤال: (${state.settings.timerSec} ث)`;
    }

    function renderSheetsInputs() {
      const urlInp = document.getElementById("sheetsUrlInput");
      const rngInp = document.getElementById("sheetsRangeInput");
      const intInp = document.getElementById("sheetsIntervalInput");
      const chkInp = document.getElementById("sheetsAutoSyncCheck");
      const stEl = document.getElementById("sheetsSyncStatus");
      if (!urlInp) return;

      urlInp.value = state.sheetsConfig.url || "";
      rngInp.value = state.sheetsConfig.range || "";
      intInp.value = state.sheetsConfig.intervalSec || 30;
      chkInp.checked = Boolean(state.sheetsConfig.autoSync);
      stEl.textContent = state.sheetsConfig.lastSyncText || "لم يتم التزامن بعد";
    }

    function renderAll() {
      updateRoleUI();
      renderStatsAndAudience();
      renderStage();
      renderPlayersGrid();
      renderOrderedScreens();
      renderSheetsInputs();
      if (state.timerRunning && !timerInterval) startTimer();
    }

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("selectionModeSelect").value = state.selectionMode || "random";
      renderAll();
      if (state.sheetsConfig.autoSync && state.sheetsConfig.url) {
        toggleGoogleSheetsAutoSync();
      }
    });
  </script>
</body>
</html>
